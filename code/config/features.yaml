# YP2021 Global/Local 공통 Feature 계약
# 원자료의 차수별 문항명·특수결측 코드는 코드북 대조 후 source adapter에서 이 이름으로 표준화한다.
version: "1.3"
target: employment_transition
id_column: SAMPID
group_column: SAMPID
metadata_columns:
  - SAMPID
  - baseline_year
  - target_year
  - hope_job_keco
  - hope_job_year
  - hope_job_source
  - job_group

features:
  - {name: gender, type: categorical, group: demographics}
  - {name: age, type: numeric, group: demographics}
  - {name: region_5, type: categorical, group: demographics}
  - {name: baseline_year, type: categorical, group: demographics}
  - {name: education_level, type: categorical, group: education}
  - {name: student_status, type: categorical, group: education}
  - {name: student_type, type: categorical, group: education}
  - {name: university_type, type: categorical, group: education}
  - {name: major_group, type: categorical, group: education}
  - {name: months_since_graduation, type: numeric, group: education}
  - {name: nonemployment_type, type: categorical, group: job_search}
  - {name: recent_job_search, type: numeric, group: job_search}
  - {name: recent_employment_prep, type: numeric, group: job_search}
  # y**c701a~c의 선택지를 Multi-Hot으로 전개한다. 순위(a/b/c) 자체는 입력하지 않는다.
  - {name: prep_effort_01, type: numeric, group: job_search}
  - {name: prep_effort_02, type: numeric, group: job_search}
  - {name: prep_effort_03, type: numeric, group: job_search}
  - {name: prep_effort_04, type: numeric, group: job_search}
  - {name: prep_effort_05, type: numeric, group: job_search}
  - {name: prep_effort_06, type: numeric, group: job_search}
  - {name: prep_effort_07, type: numeric, group: job_search}
  - {name: prep_effort_08, type: numeric, group: job_search}
  - {name: prep_effort_09, type: numeric, group: job_search}
  - {name: prep_effort_10, type: numeric, group: job_search}
  - {name: prep_effort_11, type: numeric, group: job_search}
  - {name: prep_effort_12, type: numeric, group: job_search}
  - {name: prep_effort_other, type: numeric, group: job_search}
  - {name: graduation_prep_experience, type: numeric, group: job_search}
  - {name: graduation_job_search_experience, type: numeric, group: job_search}
  - {name: has_certificate, type: numeric, group: certificate}
  - {name: certificate_count, type: numeric, group: certificate}
  - {name: has_employment_certificate, type: numeric, group: certificate}
  - {name: has_major_related_certificate, type: numeric, group: certificate}
  - {name: has_vocational_training, type: numeric, group: training}
  - {name: vocational_training_count, type: numeric, group: training}
  - {name: vocational_training_hours, type: numeric, group: training}
  - {name: exam_prep_experience, type: numeric, group: exam}
  - {name: exam_prep_count, type: numeric, group: exam}
  - {name: currently_preparing_exam, type: numeric, group: exam}
  - {name: school_work_experience, type: numeric, group: work_history}
  - {name: ever_worked_before, type: numeric, group: work_history}
  - {name: past_job_count, type: numeric, group: work_history}
  - {name: past_work_months, type: numeric, group: work_history}

# 기본 42개 Feature와 분리된 선택적 Feature. build_features(..., extra_features=[...])로
# 명시적으로 요청했을 때만 X에 포함된다 — 여기 그냥 features:에 추가하면 기존 42개 모델도
# 자동으로 43개짜리로 바뀌어버리므로, 기본 재현성을 지키려면 반드시 이 섹션에 둔다
# (2026-08-18, wjdwlsah 지시: n_prior_periods·sample_weight를 독립적으로 켜고 끌 수 있어야
# 세 실험(①Baseline ②+n_prior_periods ③+sample_weight)을 동일 조건에서 비교할 수 있음).
optional_features:
  # 오버샘플링 완화용(2026-08-18): 같은 사람이 이전에 몇 번 더 미취업으로 관찰됐는지.
  # build_person_period_dataset()에서 Global 전체 이력 기준으로 1회 계산, Local엔 그대로 이어받는다.
  - {name: n_prior_periods, type: numeric, group: panel_history}

# Global Stage 2에서 사용할 25개 원 Feature. 첨부된 사람이 확정한
# `YP2021_Stage2_42features_최종_선정표.xlsx`의 사용 목록을 순서까지 그대로 옮겼다.
# 이 목록을 임의로 추가·제거하지 않으며, 기본 42개 Feature 계약 자체는 바꾸지 않는다.
feature_sets:
  global_stage2_selected_25:
    - gender
    - age
    - region_5
    - baseline_year
    - education_level
    - student_status
    - student_type
    - university_type
    - major_group
    - months_since_graduation
    - nonemployment_type
    - recent_job_search
    - recent_employment_prep
    - prep_effort_03
    - prep_effort_04
    - prep_effort_08
    - prep_effort_12
    - graduation_prep_experience
    - graduation_job_search_experience
    - has_certificate
    - has_employment_certificate
    - has_major_related_certificate
    - exam_prep_experience
    - currently_preparing_exam
    - ever_worked_before

# 공통 전처리 기준. 개별 실험에서 값을 바꾸지 않는다.
preprocessing:
  numeric_imputer: median
  categorical_missing_label: Missing
  not_applicable_label: NotApplicable
  categorical_encoder: one_hot
  rare_category_min_frequency: 10
  rare_category_label: Other
  protected_categories: [Missing, NotApplicable]
  scaler_models: [logistic_regression]
